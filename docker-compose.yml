services:
  # ============ BASES DE DATOS (Persistencia Poliglota) ============
  postgres-auth:
    image: postgres:15-alpine
    container_name: mc-postgres-auth
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/auth.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediconnect-net

  postgres-patient:
    image: postgres:15-alpine
    container_name: mc-postgres-patient
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect123
      POSTGRES_DB: patient_db
    ports:
      - "5434:5432"
    volumes:
      - pg_patient_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/patient.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediconnect-net

  postgres-doctor:
    image: postgres:15-alpine
    container_name: mc-postgres-doctor
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect123
      POSTGRES_DB: doctor_db
    ports:
      - "5435:5432"
    volumes:
      - pg_doctor_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/doctor.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediconnect-net

  postgres-appointment:
    image: postgres:15-alpine
    container_name: mc-postgres-appointment
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect123
      POSTGRES_DB: appointment_db
    ports:
      - "5436:5432"
    volumes:
      - pg_appointment_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/appointment.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediconnect-net

  mongo-medical-history:
    image: mongo:6
    container_name: mc-mongo-medical-history
    environment:
      MONGO_INITDB_ROOT_USERNAME: mediconnect
      MONGO_INITDB_ROOT_PASSWORD: mediconnect123
      MONGO_INITDB_DATABASE: medical_history_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_history_data:/data/db
    networks:
      - mediconnect-net

  mongo-video:
    image: mongo:6
    container_name: mc-mongo-video
    environment:
      MONGO_INITDB_ROOT_USERNAME: mediconnect
      MONGO_INITDB_ROOT_PASSWORD: mediconnect123
      MONGO_INITDB_DATABASE: video_db
    ports:
      - "27018:27017"
    volumes:
      - mongo_video_data:/data/db
    networks:
      - mediconnect-net

  # ============ MVP 2: DBs adicionales ============
  postgres-prescription:
    image: postgres:15-alpine
    container_name: mc-postgres-prescription
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect123
      POSTGRES_DB: prescription_db
    ports:
      - "5437:5432"
    volumes:
      - pg_prescription_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/prescription.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediconnect-net

  postgres-pharmacy:
    image: postgres:15-alpine
    container_name: mc-postgres-pharmacy
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect123
      POSTGRES_DB: pharmacy_db
    ports:
      - "5438:5432"
    volumes:
      - pg_pharmacy_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/pharmacy.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediconnect-net

  mongo-laboratory:
    image: mongo:6
    container_name: mc-mongo-laboratory
    environment:
      MONGO_INITDB_ROOT_USERNAME: mediconnect
      MONGO_INITDB_ROOT_PASSWORD: mediconnect123
      MONGO_INITDB_DATABASE: laboratory_db
    ports:
      - "27019:27017"
    volumes:
      - mongo_lab_data:/data/db
    networks:
      - mediconnect-net

  # ============ MVP 3: DBs adicionales ============
  mongo-iot:
    image: mongo:6
    container_name: mc-mongo-iot
    environment:
      MONGO_INITDB_ROOT_USERNAME: mediconnect
      MONGO_INITDB_ROOT_PASSWORD: mediconnect123
      MONGO_INITDB_DATABASE: iot_db
    ports:
      - "27020:27017"
    volumes:
      - mongo_iot_data:/data/db
    networks:
      - mediconnect-net

  mongo-alert:
    image: mongo:6
    container_name: mc-mongo-alert
    environment:
      MONGO_INITDB_ROOT_USERNAME: mediconnect
      MONGO_INITDB_ROOT_PASSWORD: mediconnect123
      MONGO_INITDB_DATABASE: alert_db
    ports:
      - "27021:27017"
    volumes:
      - mongo_alert_data:/data/db
    networks:
      - mediconnect-net

  postgres-rating:
    image: postgres:15-alpine
    container_name: mc-postgres-rating
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect123
      POSTGRES_DB: rating_db
    ports:
      - "5439:5432"
    volumes:
      - pg_rating_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/rating.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediconnect-net

  # ============ MVP 4: BD inmutable de auditoría ============
  postgres-audit:
    image: postgres:15-alpine
    container_name: mc-postgres-audit
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect123
      POSTGRES_DB: audit_db
    ports:
      - "5440:5432"
    volumes:
      - pg_audit_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/audit.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediconnect-net

  redis:
    image: redis:7-alpine
    container_name: mc-redis
    ports:
      - "6379:6379"
    networks:
      - mediconnect-net

  # ============ MENSAJERÍA ASÍNCRONA ============
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mediconnect
      RABBITMQ_DEFAULT_PASS: mediconnect123
    networks:
      - mediconnect-net

  # ============ MICROSERVICIOS ============
  auth-service:
    build: ./services/auth-service
    container_name: mc-auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_USER: mediconnect
      DB_PASS: mediconnect123
      DB_NAME: auth_db
      JWT_SECRET: mediconnect-super-secret-2026
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
    depends_on:
      - postgres-auth
      - rabbitmq
    networks:
      - mediconnect-net

  patient-service:
    build: ./services/patient-service
    container_name: mc-patient-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres-patient
      DB_PORT: 5432
      DB_USER: mediconnect
      DB_PASS: mediconnect123
      DB_NAME: patient_db
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
    depends_on:
      - postgres-patient
      - rabbitmq
    networks:
      - mediconnect-net

  doctor-service:
    build: ./services/doctor-service
    container_name: mc-doctor-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres-doctor
      DB_PORT: 5432
      DB_USER: mediconnect
      DB_PASS: mediconnect123
      DB_NAME: doctor_db
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
    depends_on:
      - postgres-doctor
      - rabbitmq
    networks:
      - mediconnect-net

  appointment-service:
    build: ./services/appointment-service
    container_name: mc-appointment-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres-appointment
      DB_PORT: 5432
      DB_USER: mediconnect
      DB_PASS: mediconnect123
      DB_NAME: appointment_db
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
      PATIENT_SERVICE_URL: http://patient-service:3002
      DOCTOR_SERVICE_URL: http://doctor-service:3003
    depends_on:
      - postgres-appointment
      - rabbitmq
    networks:
      - mediconnect-net

  medical-history-service:
    build: ./services/medical-history-service
    container_name: mc-medical-history-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      MONGO_URI: mongodb://mediconnect:mediconnect123@mongo-medical-history:27017/medical_history_db?authSource=admin
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
    depends_on:
      - mongo-medical-history
      - rabbitmq
    networks:
      - mediconnect-net

  videoconsultation-service:
    build: ./services/videoconsultation-service
    container_name: mc-videoconsultation-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      MONGO_URI: mongodb://mediconnect:mediconnect123@mongo-video:27017/video_db?authSource=admin
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
      ENCRYPTION_KEY: mediconnect-aes-256-encryption-k
    depends_on:
      - mongo-video
      - rabbitmq
    networks:
      - mediconnect-net

  # ============ MVP 2: Microservicios ============
  prescription-service:
    build: ./services/prescription-service
    container_name: mc-prescription-service
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      DB_HOST: postgres-prescription
      DB_PORT: 5432
      DB_USER: mediconnect
      DB_PASS: mediconnect123
      DB_NAME: prescription_db
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
      PATIENT_SERVICE_URL: http://patient-service:3002
      DOCTOR_SERVICE_URL: http://doctor-service:3003
      PHARMACY_SERVICE_URL: http://pharmacy-service:3008
      PRESCRIPTION_EXPIRY_DAYS: 30
    depends_on:
      - postgres-prescription
      - rabbitmq
    networks:
      - mediconnect-net

  pharmacy-service:
    build: ./services/pharmacy-service
    container_name: mc-pharmacy-service
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      DB_HOST: postgres-pharmacy
      DB_PORT: 5432
      DB_USER: mediconnect
      DB_PASS: mediconnect123
      DB_NAME: pharmacy_db
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
    depends_on:
      - postgres-pharmacy
      - rabbitmq
    networks:
      - mediconnect-net

  laboratory-service:
    build: ./services/laboratory-service
    container_name: mc-laboratory-service
    ports:
      - "3009:3009"
    environment:
      PORT: 3009
      MONGO_URI: mongodb://mediconnect:mediconnect123@mongo-laboratory:27017/laboratory_db?authSource=admin
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
      LAB_API_KEYS: "lab-key-sanmartin-2026,lab-key-anglolab-2026,lab-key-roe-2026"
    depends_on:
      - mongo-laboratory
      - rabbitmq
    networks:
      - mediconnect-net

  # ============ MVP 3: Microservicios ============
  iot-service:
    build: ./services/iot-service
    container_name: mc-iot-service
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      MONGO_URI: mongodb://mediconnect:mediconnect123@mongo-iot:27017/iot_db?authSource=admin
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
      IOT_DEVICE_KEYS: "dev-glucometer-2026,dev-bp-monitor-2026,dev-oximeter-2026"
    depends_on:
      - mongo-iot
      - rabbitmq
    networks:
      - mediconnect-net

  alert-service:
    build: ./services/alert-service
    container_name: mc-alert-service
    ports:
      - "3011:3011"
    environment:
      PORT: 3011
      MONGO_URI: mongodb://mediconnect:mediconnect123@mongo-alert:27017/alert_db?authSource=admin
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
    depends_on:
      - mongo-alert
      - rabbitmq
    networks:
      - mediconnect-net

  rating-service:
    build: ./services/rating-service
    container_name: mc-rating-service
    ports:
      - "3012:3012"
    environment:
      PORT: 3012
      DB_HOST: postgres-rating
      DB_PORT: 5432
      DB_USER: mediconnect
      DB_PASS: mediconnect123
      DB_NAME: rating_db
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
      APPOINTMENT_SERVICE_URL: http://appointment-service:3004
    depends_on:
      - postgres-rating
      - rabbitmq
    networks:
      - mediconnect-net

  # ============ MVP 4: Audit Service ============
  audit-service:
    build: ./services/audit-service
    container_name: mc-audit-service
    ports:
      - "3013:3013"
    environment:
      PORT: 3013
      DB_HOST: postgres-audit
      DB_PORT: 5432
      DB_USER: mediconnect
      DB_PASS: mediconnect123
      DB_NAME: audit_db
      RABBITMQ_URL: amqp://mediconnect:mediconnect123@rabbitmq:5672
    depends_on:
      - postgres-audit
      - rabbitmq
    networks:
      - mediconnect-net

  api-gateway:
    build: ./services/api-gateway
    container_name: mc-api-gateway
    ports:
      - "3100:3000"
    environment:
      PORT: 3000
      JWT_SECRET: mediconnect-super-secret-2026
      AUTH_SERVICE_URL: http://auth-service:3001
      PATIENT_SERVICE_URL: http://patient-service:3002
      DOCTOR_SERVICE_URL: http://doctor-service:3003
      APPOINTMENT_SERVICE_URL: http://appointment-service:3004
      MEDICAL_HISTORY_SERVICE_URL: http://medical-history-service:3005
      VIDEO_SERVICE_URL: http://videoconsultation-service:3006
      PRESCRIPTION_SERVICE_URL: http://prescription-service:3007
      PHARMACY_SERVICE_URL: http://pharmacy-service:3008
      LABORATORY_SERVICE_URL: http://laboratory-service:3009
      IOT_SERVICE_URL: http://iot-service:3010
      ALERT_SERVICE_URL: http://alert-service:3011
      RATING_SERVICE_URL: http://rating-service:3012
      AUDIT_SERVICE_URL: http://audit-service:3013
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - appointment-service
      - medical-history-service
      - videoconsultation-service
      - prescription-service
      - pharmacy-service
      - laboratory-service
      - iot-service
      - alert-service
      - rating-service
      - audit-service
    networks:
      - mediconnect-net

  frontend:
    image: nginx:alpine
    container_name: mc-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - mediconnect-net

networks:
  mediconnect-net:
    driver: bridge

volumes:
  pg_auth_data:
  pg_patient_data:
  pg_doctor_data:
  pg_appointment_data:
  pg_prescription_data:
  pg_pharmacy_data:
  pg_rating_data:
  pg_audit_data:
  mongo_history_data:
  mongo_video_data:
  mongo_lab_data:
  mongo_iot_data:
  mongo_alert_data:
